name: Update feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch YouTube and podcast feeds
        run: python3 scripts/update_feeds.py
      - name: Commit and republish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          if git diff --quiet -- data/feeds.json; then
            echo "No change"; exit 0
          fi
          git add data/feeds.json
          git commit -m "Update feeds"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
